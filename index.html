<title>Skills Cam</title>
<style>
  :root {
    --bg: #f6f4f1; --card: #ffffff; --ink: #1d1b19; --muted: #8a847d;
    --line: #e7e2dc; --accent: #2b2622; --pill: #efebe6;
    --safe-t: env(safe-area-inset-top); --safe-b: env(safe-area-inset-bottom);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    overscroll-behavior: none; touch-action: manipulation; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; }
  .screen.on { display: flex; }

  /* ---------- Skills list ---------- */
  #home { overflow-y: auto; padding: calc(var(--safe-t) + 18px) 18px calc(var(--safe-b) + 24px); }
  .home-head { display: flex; align-items: baseline; justify-content: space-between; margin: 6px 4px 18px; }
  .home-head h1 { font-size: 30px; letter-spacing: -0.02em; margin: 0; }
  .home-head span { color: var(--muted); font-size: 14px; }
  .skill { display: flex; align-items: center; gap: 14px; background: var(--card); border-radius: 22px;
    padding: 14px 14px 14px 14px; margin-bottom: 12px; box-shadow: 0 1px 0 var(--line); }
  .skill .icon { width: 58px; height: 58px; border-radius: 50%; flex: none; position: relative; overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
  .skill .icon svg { position: absolute; inset: 14px; width: 30px; height: 30px; }
  .skill .txt { flex: 1; min-width: 0; }
  .skill .name { font-weight: 650; font-size: 17px; }
  .skill .desc { color: var(--muted); font-size: 13.5px; margin-top: 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .snap { background: var(--pill); border-radius: 999px; padding: 9px 18px; font-weight: 600; font-size: 15px; flex: none; }
  .snap:active { transform: scale(.96); }
  .create { opacity: .55; }
  .create .icon { background: var(--pill); display: grid; place-items: center; font-size: 28px; color: var(--muted); }
  .note { color: var(--muted); font-size: 13px; text-align: center; margin: 18px 10px 0; }

  /* ---------- Camera ---------- */
  #cam { background: #000; color: #fff; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #view.mirror { transform: scaleX(-1); }
  #stamp { position: absolute; right: 7%; bottom: calc(var(--safe-b) + 232px); display: none;
    font: 600 22px/1 "Courier New", ui-monospace, monospace; color: #ff9a3c; letter-spacing: .06em;
    text-shadow: 0 0 6px rgba(255,120,30,.8); pointer-events: none; }
  .cam-top { position: absolute; left: 0; right: 0; top: 0; padding: calc(var(--safe-t) + 10px) 14px 10px;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(rgba(0,0,0,.45), transparent); }
  .round { width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,.35); display: grid; place-items: center;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .round svg { width: 22px; height: 22px; }
  #camTitle { font-weight: 650; font-size: 16px; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .cam-bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 0 calc(var(--safe-b) + 18px);
    background: linear-gradient(transparent, rgba(0,0,0,.6) 35%); }
  #strip { display: flex; gap: 8px; overflow-x: auto; padding: 18px 16px 16px; scrollbar-width: none; }
  #strip::-webkit-scrollbar { display: none; }
  #strip button { flex: none; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.16);
    font-size: 14px; font-weight: 600; white-space: nowrap; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #strip button.on { background: #fff; color: #000; }
  .controls { display: flex; align-items: center; justify-content: space-around; padding: 4px 22px 0; }
  #shutter { width: 78px; height: 78px; border-radius: 50%; border: 4px solid #fff; padding: 4px; }
  #shutter span { display: block; width: 100%; height: 100%; border-radius: 50%; background: #fff; transition: transform .1s; }
  #shutter:active span { transform: scale(.88); }
  .small-label { font-size: 11px; margin-top: 4px; opacity: .8; text-align: center; }
  #camMsg { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: 30px; text-align: center; gap: 14px; }
  #camMsg p { max-width: 300px; opacity: .85; margin: 0; }
  .btn { background: #fff; color: #000; border-radius: 999px; padding: 12px 22px; font-weight: 650; }
  .btn.ghost { background: rgba(255,255,255,.16); color: #fff; }

  /* ---------- Working overlay ---------- */
  #busy { position: fixed; inset: 0; background: rgba(246,244,241,.92); display: none; z-index: 20;
    flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  #busy.on { display: flex; }
  .dots { display: flex; gap: 8px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--ink); animation: d 1s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes d { 0%,100% { opacity: .2; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }

  /* ---------- Result ---------- */
  #result { overflow-y: auto; padding: calc(var(--safe-t) + 10px) 16px calc(var(--safe-b) + 24px); }
  .res-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .res-top .round { background: var(--card); color: var(--ink); box-shadow: 0 1px 0 var(--line); }
  .seeing { color: var(--muted); font-size: 14px; }
  .photo { position: relative; border-radius: 24px; overflow: hidden; background: #ddd; user-select: none; -webkit-user-select: none; }
  .photo img { display: block; width: 100%; -webkit-touch-callout: default; }
  .tag { position: absolute; left: 12px; bottom: 12px; background: rgba(0,0,0,.5); color: #fff; font-size: 12px;
    padding: 6px 10px; border-radius: 999px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .hint { color: var(--muted); font-size: 13px; text-align: center; margin: 10px 0 16px; }
  .row { display: flex; gap: 10px; }
  .row .btn { flex: 1; text-align: center; background: var(--accent); color: #fff; }
  .row .btn.ghost { background: var(--card); color: var(--ink); box-shadow: 0 1px 0 var(--line); }
  #toast { position: fixed; left: 50%; bottom: calc(var(--safe-b) + 30px); transform: translateX(-50%);
    background: #1d1b19; color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; display: none; z-index: 30; }
  input[type=file] { display: none; }
  /* ---------- Lock ---------- */
  #lock { align-items: center; justify-content: center; gap: 22px; padding: calc(var(--safe-t) + 20px) 24px calc(var(--safe-b) + 20px); }
  #lock .logo { width: 84px; height: 84px; border-radius: 24px; background-size: cover; box-shadow: 0 6px 20px rgba(0,0,0,.12); }
  #lock h2 { margin: 0; font-size: 20px; }
  .pins { display: flex; gap: 14px; height: 16px; }
  .pins i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); }
  .pins i.f { background: var(--ink); }
  .pins.shake { animation: sh .35s; }
  @keyframes sh { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  .pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 16px; margin-top: 8px; }
  .pad button { width: 76px; height: 76px; border-radius: 50%; background: var(--card); font-size: 30px; font-weight: 400; box-shadow: 0 1px 0 var(--line); }
  .pad button:active { background: var(--pill); }
  .pad .ghost { background: none; box-shadow: none; font-size: 16px; color: var(--muted); }
  #lockMsg { color: var(--muted); font-size: 14px; min-height: 18px; }


  /* ---------- shared bits (stage 3/4) ---------- */
  .hdr { display: flex; align-items: center; gap: 10px; padding: calc(var(--safe-t) + 10px) 14px 10px; }
  .hdr h3 { flex: 1; text-align: center; margin: 0; font-size: 17px; }
  .hdr .round { background: var(--card); color: var(--ink); box-shadow: 0 1px 0 var(--line); }
  .hdr .spacer { width: 44px; }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .gear { width: 40px; height: 40px; border-radius: 50%; background: var(--card); display: grid; place-items: center; box-shadow: 0 1px 0 var(--line); }
  .gear svg { width: 20px; height: 20px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 2px 7px; border-radius: 999px;
    background: #1d1b19; color: #fff; vertical-align: 2px; margin-left: 6px; }
  .badge.f { background: var(--pill); color: var(--muted); }
  .skill .icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .create { opacity: 1; cursor: pointer; }
  .field { margin: 0 0 16px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin: 0 4px 6px; }
  .field input, .field textarea { width: 100%; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 13px 14px; outline: none; }
  .field textarea { min-height: 120px; resize: vertical; line-height: 1.4; }
  .field input:focus, .field textarea:focus { border-color: #b9b1a8; }
  .help { font-size: 13px; color: var(--muted); margin: 6px 4px 0; }
  .ok { color: #2f7a43; } .bad { color: #b3261e; }
  .btn.dark { background: var(--accent); color: #fff; }
  .btn.light { background: var(--card); color: var(--ink); box-shadow: 0 1px 0 var(--line); }
  .btn.red { background: none; color: #b3261e; }
  .btn.small { padding: 9px 16px; font-size: 14px; }
  .btn:disabled { opacity: .45; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .seg { display: flex; background: var(--pill); border-radius: 14px; padding: 4px; gap: 4px; }
  .seg button { flex: 1; padding: 10px 6px; border-radius: 11px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .pad16 { padding: 4px 16px calc(var(--safe-b) + 28px); }

  /* ---------- Create chat ---------- */
  #create { background: #f3f1ef; }
  .chat { padding: 6px 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 84%; padding: 13px 16px; border-radius: 22px; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
  .msg.ai { background: var(--card); align-self: flex-start; box-shadow: 0 1px 0 var(--line); }
  .msg.you { background: #e6e2dd; align-self: flex-end; }
  .card { background: var(--card); border-radius: 24px; padding: 18px; box-shadow: 0 1px 0 var(--line); align-self: stretch; }
  .card h4 { margin: 0 0 12px; font-size: 18px; }
  .card .count { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .opt { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 16px; }
  .opt i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; font-style: normal; font-size: 13px; }
  .opt.on i { background: var(--ink); color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 9px 14px; border-radius: 999px; background: var(--pill); font-size: 14px; font-weight: 600; }
  .chip.on { background: var(--ink); color: #fff; }
  .steps { list-style: none; padding: 0; margin: 4px 0 0; }
  .steps li { display: flex; align-items: center; gap: 10px; padding: 5px 0; color: var(--muted); }
  .steps li b { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #c9c2ba; flex: none; }
  .steps li.run { color: var(--ink); } .steps li.run b { border-color: var(--ink); border-right-color: transparent; animation: spin .8s linear infinite; }
  .steps li.done { color: var(--ink); } .steps li.done b { background: var(--ink); border-color: var(--ink); }
  .steps li.err { color: #b3261e; } .steps li.err b { border-color: #b3261e; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .skillcard { text-align: center; }
  .skillcard .bigicon { width: 96px; height: 96px; border-radius: 50%; margin: 2px auto 12px; overflow: hidden; position: relative; }
  .skillcard .bigicon img { width: 100%; height: 100%; object-fit: cover; }
  .skillcard .nm { font-size: 21px; font-weight: 700; }
  .skillcard .lb { font-size: 14px; margin: 4px 0; }
  .skillcard .ds { color: var(--muted); margin: 6px 0 14px; }
  .skillcard .btn { width: 100%; }
  .skillcard .link { display: block; margin: 10px auto 0; color: var(--muted); font-size: 14px; text-decoration: underline; }
  .composer { padding: 8px 12px calc(var(--safe-b) + 10px); background: linear-gradient(transparent, #f3f1ef 30%); }
  .quick { display: flex; gap: 8px; overflow-x: auto; padding: 0 2px 10px; scrollbar-width: none; }
  .quick::-webkit-scrollbar { display: none; }
  .quick .chip { flex: none; background: var(--card); box-shadow: 0 1px 0 var(--line); }
  .inputrow { display: flex; align-items: flex-end; gap: 8px; background: var(--card); border-radius: 26px; padding: 6px 6px 6px 16px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .inputrow textarea { flex: 1; border: 0; outline: none; resize: none; font: inherit; background: none; color: var(--ink);
    max-height: 140px; padding: 9px 0; line-height: 1.35; }
  .send { width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; flex: none; }
  .send:disabled { opacity: .3; }
  .send svg { width: 20px; height: 20px; }

  /* ---------- Sheet (try it) ---------- */
  #sheet { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 15; align-items: flex-end; }
  #sheet.on { display: flex; }
  .sheet-body { background: var(--bg); width: 100%; max-height: 92%; border-radius: 26px 26px 0 0; display: flex; flex-direction: column; }
  .sheet-body .scroll { padding: 16px 16px 8px; }
  .sheet-actions { display: flex; gap: 10px; padding: 10px 16px calc(var(--safe-b) + 14px); border-top: 1px solid var(--line); }
  .sheet-actions .btn { flex: 1; }

  /* ---------- Result extras ---------- */
  .status { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); margin: 10px 4px 0; min-height: 20px; }
  .status .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--pill); overflow: hidden; }
  .status .bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .4s; }
  .rtitle { font-size: 24px; font-weight: 750; letter-spacing: -0.01em; margin: 14px 4px 4px; }
  .rstory { color: #4c4741; margin: 0 4px 14px; line-height: 1.45; }
  .refine { display: flex; gap: 8px; margin-top: 14px; }
  .refine input { flex: 1; font: inherit; border: 1px solid var(--line); border-radius: 999px; padding: 12px 16px; background: var(--card); outline: none; }
  .photo .shade { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(255,255,255,.25); }
</style>
</head>

<section id="create" class="screen">

  </div>
